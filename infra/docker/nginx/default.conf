server {
    listen 80;
    server_name _;

    # ── Forward all traffic to the C++ application ─────────────────────────
    location / {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support long-lived connections (Server-Sent Events if ever added)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Increase upload limit for future document inserts
        client_max_body_size 50M;
    }

    # ── Health check passthrough (used by CI and monitoring) ───────────────
    location /health {
        proxy_pass http://app:8080/health;
    }

    location /ready {
        proxy_pass http://app:8080/ready;
    }
}
