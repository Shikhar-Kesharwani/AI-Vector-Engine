version: '3.8'
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - app-network
    healthcheck:
      test: ['CMD','curl','-f','http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  app-network:
    driver: bridge
